# Nginx — serve frontend static + proxy API ke backend container
server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # gzip untuk performa
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Static frontend (Vite build)
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — semua route fallback ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API backend
    location /v1/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generate bisa makan waktu (LLM 1-10 menit) — jangan diputus
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        # SSE (document processing events)
        proxy_buffering off;
    }

    # Swagger docs backend
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Cache assets hash Vite (immutable)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
